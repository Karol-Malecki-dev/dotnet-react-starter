services:
  db:
    image: postgres:16-alpine
    container_name: dotnet-react-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dotnetreact}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dotnet-react-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dotnetreact}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: dotnet-react-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - dotnet-react-network

  # Backend API (.NET)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dotnet-react-backend
    ports:
      - "${BACKEND_HTTP_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://+:5000}
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION:-Host=db;Port=5432;Database=dotnetreact;Username=postgres;Password=postgres}
      - Jwt__Secret=${JWT_SECRET:-local-development-only-secret-change-before-production-123456789}
      - Jwt__Issuer=${JWT_ISSUER:-Dotnet-React-Starter-API}
      - Jwt__Audience=${JWT_AUDIENCE:-Dotnet-React-Starter-App}
      - Jwt__AccessTokenExpiresInMinutes=${JWT_ACCESS_TOKEN_EXPIRES_IN_MINUTES:-15}
      - Jwt__RefreshTokenExpiresInDays=${JWT_REFRESH_TOKEN_EXPIRES_IN_DAYS:-7}
      - Jwt__RefreshTokenCookieName=${JWT_REFRESH_TOKEN_COOKIE_NAME:-drs.refreshToken}
      - Jwt__RefreshTokenCookiePath=${JWT_REFRESH_TOKEN_COOKIE_PATH:-/api/auth}
      - Jwt__RefreshTokenCookieSameSite=${JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:-Lax}
      - Jwt__RefreshTokenCookieSecurePolicy=${JWT_REFRESH_TOKEN_COOKIE_SECURE_POLICY:-SameAsRequest}
      - Jwt__RefreshTokenCookieIsEssential=${JWT_REFRESH_TOKEN_COOKIE_IS_ESSENTIAL:-true}
      - Jwt__RefreshTokenCookieDomain=${JWT_REFRESH_TOKEN_COOKIE_DOMAIN:-}
      - DataProtection__KeyRingPath=${DATA_PROTECTION_KEY_RING_PATH:-/home/app/.aspnet/DataProtection-Keys}
      - DataProtection__ApplicationName=${DATA_PROTECTION_APPLICATION_NAME:-DotnetReactStarter}
      - ForwardedHeaders__Enabled=${FORWARDED_HEADERS_ENABLED:-true}
      - ForwardedHeaders__KnownNetworks__0=${FORWARDED_HEADERS_KNOWN_NETWORK_0:-172.28.0.0/16}
      - ForwardedHeaders__ForwardLimit=${FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      - Cors__AllowCredentials=${CORS_ALLOW_CREDENTIALS:-true}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      - Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_1:-http://localhost:5173}
      - Cors__AllowedOrigins__2=${CORS_ALLOWED_ORIGIN_2:-https://localhost:5173}
      - EmailConfirmation__PublicOrigin=${EMAIL_CONFIRMATION_PUBLIC_ORIGIN:-http://localhost:3000}
      - EmailConfirmation__ConfirmationPath=${EMAIL_CONFIRMATION_CONFIRMATION_PATH:-/confirm-email}
      - EmailConfirmation__TokenExpiresInHours=${EMAIL_CONFIRMATION_TOKEN_EXPIRES_IN_HOURS:-24}
      - EmailTwoFactor__Enabled=${EMAIL_TWO_FACTOR_ENABLED:-true}
      - EmailTwoFactor__EnableForNewUsers=${EMAIL_TWO_FACTOR_ENABLE_FOR_NEW_USERS:-true}
      - EmailTwoFactor__CodeExpiresInMinutes=${EMAIL_TWO_FACTOR_CODE_EXPIRES_IN_MINUTES:-10}
      - EmailTwoFactor__CodeLength=${EMAIL_TWO_FACTOR_CODE_LENGTH:-6}
      - EmailTwoFactor__MaxFailedAttempts=${EMAIL_TWO_FACTOR_MAX_FAILED_ATTEMPTS:-5}
      - EmailDelivery__Enabled=${EMAIL_DELIVERY_ENABLED:-true}
      - EmailDelivery__Host=${EMAIL_DELIVERY_HOST:-mailpit}
      - EmailDelivery__Port=${EMAIL_DELIVERY_PORT:-1025}
      - EmailDelivery__FromAddress=${EMAIL_DELIVERY_FROM_ADDRESS:-noreply@dotnet-react-starter.local}
      - EmailDelivery__FromName=${EMAIL_DELIVERY_FROM_NAME:-Dotnet React Starter}
      - EmailDelivery__Username=${EMAIL_DELIVERY_USERNAME:-}
      - EmailDelivery__Password=${EMAIL_DELIVERY_PASSWORD:-}
      - EmailDelivery__UseStartTls=${EMAIL_DELIVERY_USE_START_TLS:-false}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - dotnet-react-network
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_REACT_APP_API_URL:-/api}
        NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max_old_space_size=4096}
    container_name: dotnet-react-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dotnet-react-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  dotnet-react-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  data-protection-keys:
