name: CD - Publish container images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish:
    name: Build and publish Docker images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          namespace="${IMAGE_NAMESPACE,,}"
          echo "backend=${REGISTRY}/${namespace}/dotnet-react-starter-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${namespace}/dotnet-react-starter-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=/api
            NODE_OPTIONS=--max_old_space_size=4096
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend }}:latest
