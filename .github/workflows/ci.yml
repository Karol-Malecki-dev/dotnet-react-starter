name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend solution
        run: dotnet restore backend/backend.slnx

      - name: Build backend solution
        run: dotnet build backend/backend.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/UnitTests/UnitTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        run: dotnet test backend/IntegrationTests/IntegrationTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:once
        env:
          CI: true

      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker Compose smoke tests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start application stack
        run: docker compose up --build --wait --wait-timeout 180 --detach

      - name: Run E2E smoke tests
        run: dotnet test backend/E2ETests/E2ETests.csproj --configuration Release
        env:
          SMOKE_API_URL: http://localhost:5000
          SMOKE_FRONTEND_URL: http://localhost:3000

      - name: Run browser E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_FRONTEND_URL: http://localhost:3000
          MAILPIT_API_URL: http://localhost:8025

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --remove-orphans --volumes
