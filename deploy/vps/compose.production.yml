name: dotnet-react-starter-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mailpit:
    image: axllent/mailpit:v1.27
    profiles:
      - staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        if ! mc admin user info local "$${MINIO_APP_ACCESS_KEY}" >/dev/null 2>&1; then
          mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}"
        fi
        mc admin policy create local task-attachments /config/minio-attachments-policy.json
        mc admin policy attach local task-attachments --user "$${MINIO_APP_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY}
      MINIO_BUCKET: task-attachments
    volumes:
      - ./minio-attachments-policy.json:/config/minio-attachments-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migration:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: "no"
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      AllowedHosts: ${APP_DOMAIN:?Set APP_DOMAIN};backend
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-Dotnet-React-Starter-API}
      Jwt__Audience: ${JWT_AUDIENCE:-Dotnet-React-Starter-App}
      Jwt__RefreshTokenCookieSecurePolicy: Always
      Jwt__RefreshTokenCookieSameSite: Lax
      DataProtection__KeyRingPath: /home/app/.aspnet/DataProtection-Keys
      DataProtection__ApplicationName: ${DATA_PROTECTION_APPLICATION_NAME:-DotnetReactStarter}
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: 172.29.0.0/16
      ForwardedHeaders__ForwardLimit: "1"
      Cors__AllowCredentials: "true"
      Cors__AllowedOrigins__0: https://${APP_DOMAIN}
      Cors__AllowedOrigins__1: https://${APP_DOMAIN}
      Cors__AllowedOrigins__2: https://${APP_DOMAIN}
      EmailConfirmation__PublicOrigin: https://${APP_DOMAIN}
      EmailDelivery__Enabled: "true"
      EmailDelivery__Host: ${SMTP_HOST:?Set SMTP_HOST}
      EmailDelivery__Port: ${SMTP_PORT:-587}
      EmailDelivery__FromAddress: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS}
      EmailDelivery__FromName: ${SMTP_FROM_NAME:-Dotnet React Starter}
      EmailDelivery__Username: ${SMTP_USERNAME:-}
      EmailDelivery__Password: ${SMTP_PASSWORD:-}
      EmailDelivery__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Attachments__StorageProvider: S3
      Attachments__S3BucketName: task-attachments
      Attachments__S3Region: us-east-1
      Attachments__S3ServiceUrl: http://minio:9000
      Attachments__S3ForcePathStyle: "true"
      Attachments__S3AccessKey: ${MINIO_APP_ACCESS_KEY}
      Attachments__S3SecretKey: ${MINIO_APP_SECRET_KEY}
      Attachments__RequireMalwareScan: "true"
      Attachments__MalwareScannerHost: clamav
      Attachments__MalwareScannerPort: "3310"
      Attachments__MalwareScannerTimeoutSeconds: "30"
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
      - backend-logs:/app/logs
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
      - "${PUBLIC_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
      - --storage.path=/alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:?Set ALERTMANAGER_WEBHOOK_URL}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - internal
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  postgres-data:
  minio-data:
  clamav-signatures:
  data-protection-keys:
  backend-logs:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  alertmanager-data:
